// dflow-kit — install.sh --gradle-pc 가 이 PC 의 ~/.gradle/init.d/ 에 설치하는 init 스크립트.
// 이 PC 에서 도는 모든 Gradle 빌드(및 includeBuild 로 딸려 오는 빌드)의 Test 태스크에 적용된다.
// 되돌리려면 이 파일을 지운다: ~/.gradle/init.d/dflow-test-jvm.gradle
//
// 1) 모든 Test 태스크를 빌드 캐시에서 뺀다. 테스트가 작업 트리 밖 파일·환경 변수·상태가 있는 DB 파일을 선언하지
//    않은 채 읽는 경우가 흔해, 캐시가 그 실패를 숨길 수 있기 때문이다. 안전한 방향이라 무조건 적용한다.
// 2) -XX:TieredStopAtLevel=1(테스트 JVM 의 JIT 을 C1 만 쓰게 해 CPU 사용을 약 25% 줄인다. 경과 시간은 측정상 동일)은
//    빌드 루트 폴더나 그 조상에 .dflow-agent 파일이 있을 때만(D'Flow 팀원 워크트리) 붙인다. 사람이 직접 돌리는
//    빌드는 건드리지 않는다.
//    리포의 build.gradle 이 이미 같은 플래그를 지정했으면 건너뛴다 — 이 init 스크립트는 configureEach 시점에
//    등록되므로 그 시점엔 리포 쪽 build.gradle 이 아직 Test 태스크에 jvmArgs 를 넣지 않았을 수 있다(등록 순서
//    문제). 그래서 실행 직전(doFirst)에 allJvmArgs 를 다시 확인해, 리포가 이미 -XX:TieredStopAtLevel 로 시작하는
//    인자를 넣었으면 더는 넣지 않는다. 같은 -XX 플래그가 두 번 와도 JVM 은 뒤의 값을 쓰므로 중복 자체는 무해하지만,
//    명시적으로 건너뛰는 편이 어느 값이 적용되는지 헷갈리지 않는다. 리포가 다른 레벨을 지정했으면 그 값을 그대로 존중한다.
// 3) 같은 조건에서 -XX:ReservedCodeCacheSize=240m 도 붙인다(리포가 값을 정했으면 건너뛴다). C1 만 쓰면 코드 캐시 기본값이
//    48MB 로 줄어 테스트가 많은 리포에서 CodeCache 부족 VirtualMachineError 가 난다.
gradle.allprojects { Project project ->
  project.tasks.withType(Test).configureEach { Test t ->
    t.outputs.doNotCacheIf('dflow-kit: 테스트는 선언되지 않은 외부 입력을 읽을 수 있다') { true }

    def dir = t.project.rootDir
    def isDflowAgentWorktree = false
    while (dir != null) {
      if (new File(dir, '.dflow-agent').exists()) { isDflowAgentWorktree = true; break }
      dir = dir.parentFile
    }

    if (isDflowAgentWorktree) {
      t.doFirst { Test task ->
        def already = task.allJvmArgs.any { it.startsWith('-XX:TieredStopAtLevel') }
        if (!already) {
          task.jvmArgs('-XX:TieredStopAtLevel=1')
        }
        // C1 만 쓰면(TieredStopAtLevel=1) JVM 이 ReservedCodeCacheSize 기본값을 240MB 에서 48MB 로 줄인다.
        // 테스트가 많으면 "Out of space in CodeCache for adapters" VirtualMachineError 로 무작위 클래스가 실패한다
        // (2026-09-26 dmes-standard, 테스트 1060건에서 6건). 리포가 값을 정했으면 덮지 않는다.
        def hasCodeCache = task.allJvmArgs.any { it.startsWith('-XX:ReservedCodeCacheSize') }
        if (!hasCodeCache) {
          task.jvmArgs('-XX:ReservedCodeCacheSize=240m')
        }
      }
    }
  }
}
